services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: velixeo
      POSTGRES_USER: velixeo
      POSTGRES_PASSWORD: velixeo
    ports:
      - "5432:5432"
    volumes:
      - velixeo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velixeo -d velixeo"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://velixeo:velixeo@postgres:5432/velixeo?schema=public
      JWT_SECRET: local-development-secret-change-before-production-123456
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_DAYS: 30
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db push && node dist/index.js"

volumes:
  velixeo_pgdata:
