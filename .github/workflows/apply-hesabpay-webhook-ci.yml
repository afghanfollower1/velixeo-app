name: Apply VELIXEO HesabPay Webhook CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hesabpay-webhook-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extend HesabPay mock and payment safety tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/backend-ci.yml')
          source = path.read_text()

          old_guard = """            if (req.method !== 'POST' || req.url !== '/api/v1/payment/create-session') {
              res.writeHead(404, { 'content-type': 'application/json' });
              res.end(JSON.stringify({ success: false, message: 'not found' }));
              return;
            }
"""
          new_guard = """            if (
              req.method !== 'POST' ||
              !['/api/v1/payment/create-session', '/api/v1/hesab/webhooks/verify-signature'].includes(req.url ?? '')
            ) {
              res.writeHead(404, { 'content-type': 'application/json' });
              res.end(JSON.stringify({ success: false, message: 'not found' }));
              return;
            }
"""
          if old_guard in source:
              source = source.replace(old_guard, new_guard, 1)

          parse_anchor = """            let body;
            try { body = JSON.parse(raw); } catch { body = null; }

            const valid =
"""
          parse_replacement = """            let body;
            try { body = JSON.parse(raw); } catch { body = null; }

            if (req.url === '/api/v1/hesab/webhooks/verify-signature') {
              const validSignature =
                body?.signature === 'ci-valid-signature' &&
                String(body?.timestamp ?? '') === '1707719607';
              res.writeHead(200, { 'content-type': 'application/json' });
              res.end(JSON.stringify({
                status_code: validSignature ? 10 : 40,
                success: validSignature,
                message: validSignature ? 'Signature verified' : 'Invalid signature',
              }));
              return;
            }

            const valid =
"""
          if parse_anchor in source and "body?.signature === 'ci-valid-signature'" not in source:
              source = source.replace(parse_anchor, parse_replacement, 1)

          test_anchor = """          const successReturn = await jsonRequest(`/payments/hesabpay/return/success?payment=${paymentId}`);
"""
          tests = """          const capabilities = await jsonRequest('/api/v1/payments/capabilities', { headers: authHeaders });
          if (
            capabilities.response.status !== 200 ||
            capabilities.body?.baseCurrency !== 'AFN' ||
            capabilities.body?.gateways?.HESABPAY?.configured !== true ||
            capabilities.body?.gateways?.HESABPAY?.environment !== 'sandbox' ||
            capabilities.body?.webhookUrl !== `${base}/api/v1/payments/hesabpay/webhook`
          ) {
            throw new Error(`Payment capabilities failed: ${capabilities.response.status} ${JSON.stringify(capabilities.body)}`);
          }

          const webhookBase = {
            status_code: 10,
            success: true,
            message: 'Operation successful',
            transaction_id: `ci-hesabpay-${Date.now()}`,
            amount: 500,
            timestamp: '1707719607',
            user_id: paymentId,
            items: [{ id: paymentId, name: 'VELIXEO Wallet Top-up', price: 500 }],
            email,
          };

          const invalidWebhook = await jsonRequest('/api/v1/payments/hesabpay/webhook', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ ...webhookBase, signature: 'ci-invalid-signature' }),
          });
          if (invalidWebhook.response.status !== 401 || invalidWebhook.body?.error !== 'invalid_webhook_signature') {
            throw new Error(`Invalid webhook signature was not rejected: ${invalidWebhook.response.status} ${JSON.stringify(invalidWebhook.body)}`);
          }

          const walletAfterInvalidWebhook = await jsonRequest('/api/v1/wallet', { headers: authHeaders });
          if (walletAfterInvalidWebhook.body?.balanceAfn !== '0') {
            throw new Error(`Invalid webhook changed wallet balance: ${JSON.stringify(walletAfterInvalidWebhook.body)}`);
          }

          const amountMismatchWebhook = await jsonRequest('/api/v1/payments/hesabpay/webhook', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              ...webhookBase,
              amount: 499,
              signature: 'ci-valid-signature',
            }),
          });
          if (amountMismatchWebhook.response.status !== 409 || amountMismatchWebhook.body?.error !== 'payment_amount_mismatch') {
            throw new Error(`Webhook amount mismatch was not rejected: ${amountMismatchWebhook.response.status} ${JSON.stringify(amountMismatchWebhook.body)}`);
          }

          const walletAfterMismatch = await jsonRequest('/api/v1/wallet', { headers: authHeaders });
          if (walletAfterMismatch.body?.balanceAfn !== '0') {
            throw new Error(`Amount-mismatch webhook changed wallet balance: ${JSON.stringify(walletAfterMismatch.body)}`);
          }

          const validWebhookBody = { ...webhookBase, signature: 'ci-valid-signature' };
          const validWebhook = await jsonRequest('/api/v1/payments/hesabpay/webhook', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(validWebhookBody),
          });
          if (
            validWebhook.response.status !== 200 ||
            validWebhook.body?.status !== 'PAID' ||
            validWebhook.body?.idempotent !== false
          ) {
            throw new Error(`Verified webhook did not credit payment: ${validWebhook.response.status} ${JSON.stringify(validWebhook.body)}`);
          }

          const walletAfterVerifiedWebhook = await jsonRequest('/api/v1/wallet', { headers: authHeaders });
          if (walletAfterVerifiedWebhook.response.status !== 200 || walletAfterVerifiedWebhook.body?.balanceAfn !== '500') {
            throw new Error(`Verified webhook did not credit wallet exactly once: ${JSON.stringify(walletAfterVerifiedWebhook.body)}`);
          }

          const duplicateWebhook = await jsonRequest('/api/v1/payments/hesabpay/webhook', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(validWebhookBody),
          });
          if (
            duplicateWebhook.response.status !== 200 ||
            duplicateWebhook.body?.status !== 'PAID' ||
            duplicateWebhook.body?.idempotent !== true
          ) {
            throw new Error(`Duplicate webhook was not idempotent: ${duplicateWebhook.response.status} ${JSON.stringify(duplicateWebhook.body)}`);
          }

          const walletAfterDuplicate = await jsonRequest('/api/v1/wallet', { headers: authHeaders });
          if (walletAfterDuplicate.body?.balanceAfn !== '500') {
            throw new Error(`Duplicate webhook credited wallet twice: ${JSON.stringify(walletAfterDuplicate.body)}`);
          }

          const paidStatus = await jsonRequest(`/api/v1/payments/${paymentId}`, { headers: authHeaders });
          if (
            paidStatus.response.status !== 200 ||
            paidStatus.body?.payment?.status !== 'PAID' ||
            paidStatus.body?.payment?.externalId !== webhookBase.transaction_id ||
            !paidStatus.body?.payment?.verifiedAt
          ) {
            throw new Error(`Paid payment status is incomplete: ${paidStatus.response.status} ${JSON.stringify(paidStatus.body)}`);
          }

          const successReturn = await jsonRequest(`/payments/hesabpay/return/success?payment=${paymentId}`);
"""
          if test_anchor in source and "const capabilities = await jsonRequest('/api/v1/payments/capabilities'" not in source:
              source = source.replace(test_anchor, tests, 1)

          path.write_text(source)
          PY

      - name: Commit CI coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VELIXEO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/backend-ci.yml
          if git diff --cached --quiet; then
            echo "HesabPay webhook CI coverage already applied."
            exit 0
          fi
          git commit -m "Test verified idempotent HesabPay wallet credits"
          git push origin HEAD:main
