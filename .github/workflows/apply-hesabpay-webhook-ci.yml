name: Apply VELIXEO HesabPay Webhook CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hesabpay-webhook-ci.yml'
      - 'tools/patch_hesabpay_webhook_ci.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Patch backend CI
        run: python3 tools/patch_hesabpay_webhook_ci.py

      - name: Commit CI coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VELIXEO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/backend-ci.yml
          if git diff --cached --quiet; then
            echo "HesabPay webhook CI coverage already applied."
            exit 0
          fi
          git commit -m "Test verified idempotent HesabPay wallet credits"
          git push origin HEAD:main
