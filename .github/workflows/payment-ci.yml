name: Test VELIXEO Payments

on:
  push:
    branches: [main]
    paths:
      - 'backend/src/paymentRoutes.ts'
      - 'backend/src/hesabPayWebhookRoutes.ts'
      - 'backend/src/index.ts'
      - 'backend/prisma/schema.prisma'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - '.github/workflows/payment-ci.yml'
  workflow_dispatch:

concurrency:
  group: velixeo-payments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payment-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://velixeo:velixeo@127.0.0.1:5432/velixeo?schema=public
      NODE_ENV: test
      PORT: 8080
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      CORS_ORIGINS: ''
      HESABPAY_ENVIRONMENT: sandbox
      HESABPAY_API_KEY: ci-hesabpay-api-key
      HESABPAY_API_BASE_URL: http://127.0.0.1:9081
      HESABPAY_TIMEOUT_MS: 5000
      PUBLIC_BASE_URL: http://127.0.0.1:8080

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velixeo
          POSTGRES_PASSWORD: velixeo
          POSTGRES_DB: velixeo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U velixeo -d velixeo"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked dependencies
        run: npm ci

      - name: Validate and create test schema
        run: |
          npx prisma validate
          npx prisma db push
          npx prisma generate

      - name: Build backend
        run: npm run build

      - name: Start HesabPay mock gateway
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/hesabpay-mock.mjs" <<'NODE'
          import http from 'node:http';

          const json = (res, status, body) => {
            res.writeHead(status, { 'content-type': 'application/json' });
            res.end(JSON.stringify(body));
          };

          const server = http.createServer(async (req, res) => {
            if (req.method !== 'POST') return json(res, 404, { success: false });
            if (req.headers.authorization !== 'API-KEY ci-hesabpay-api-key') {
              return json(res, 401, { success: false, message: 'bad api key' });
            }

            let raw = '';
            for await (const chunk of req) raw += chunk;
            let body = null;
            try { body = JSON.parse(raw); } catch {}

            if (req.url === '/api/v1/hesab/webhooks/verify-signature') {
              const valid =
                body?.signature === 'ci-valid-signature' &&
                String(body?.timestamp ?? '') === '1707719607';
              return json(res, 200, {
                status_code: valid ? 10 : 40,
                success: valid,
                message: valid ? 'Signature verified' : 'Invalid signature',
              });
            }

            if (req.url === '/api/v1/payment/create-session') {
              const item = Array.isArray(body?.items) ? body.items[0] : null;
              const valid =
                typeof body?.user_id === 'string' &&
                item?.id === body.user_id &&
                item?.name === 'VELIXEO Wallet Top-up' &&
                Number.isInteger(item?.price) &&
                item.price > 0 &&
                typeof body?.redirect_success_url === 'string' &&
                typeof body?.redirect_failure_url === 'string';
              if (!valid) return json(res, 400, { success: false, message: 'invalid payload' });
              return json(res, 200, {
                status_code: 10,
                success: true,
                message: 'Payment session created successfully',
                url: `https://checkout.example/${body.user_id}`,
              });
            }

            return json(res, 404, { success: false, message: 'not found' });
          });

          server.listen(9081, '127.0.0.1');
          NODE
          node "$RUNNER_TEMP/hesabpay-mock.mjs" > "$RUNNER_TEMP/hesabpay-mock.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/hesabpay-mock.pid"
          sleep 1

      - name: Start VELIXEO backend
        shell: bash
        run: |
          set -euo pipefail
          node dist/index.js > "$RUNNER_TEMP/velixeo-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/velixeo-backend.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/velixeo-backend.log"
          exit 1

      - name: Verify payment and webhook safety
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = 'http://127.0.0.1:8080';
          const email = `payments-${Date.now()}@example.invalid`;
          const password = 'VELIXEO-CI-Password-123!';

          async function call(path, options = {}) {
            const response = await fetch(`${base}${path}`, options);
            const text = await response.text();
            let body = null;
            if (text) {
              try { body = JSON.parse(text); } catch { body = text; }
            }
            return { response, body };
          }

          const registration = await call('/api/v1/auth/register', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ fullName: 'Payment CI', email, password, locale: 'FA' }),
          });
          if (registration.response.status !== 201 || !registration.body?.accessToken) {
            throw new Error(`Registration failed: ${registration.response.status} ${JSON.stringify(registration.body)}`);
          }
          const authHeaders = { authorization: `Bearer ${registration.body.accessToken}` };

          const capabilities = await call('/api/v1/payments/capabilities', { headers: authHeaders });
          if (
            capabilities.response.status !== 200 ||
            capabilities.body?.baseCurrency !== 'AFN' ||
            capabilities.body?.gateways?.HESABPAY?.configured !== true ||
            capabilities.body?.gateways?.HESABPAY?.environment !== 'sandbox' ||
            capabilities.body?.webhookUrl !== `${base}/api/v1/payments/hesabpay/webhook`
          ) {
            throw new Error(`Capabilities invalid: ${capabilities.response.status} ${JSON.stringify(capabilities.body)}`);
          }

          async function createPayment(amount, suffix) {
            const result = await call('/api/v1/payments/hesabpay/session', {
              method: 'POST',
              headers: { ...authHeaders, 'content-type': 'application/json' },
              body: JSON.stringify({
                amountAfn: amount,
                idempotencyKey: `ci-${suffix}-${Date.now()}-${Math.random()}`,
              }),
            });
            if (result.response.status !== 201 || result.body?.payment?.status !== 'PENDING') {
              throw new Error(`Create payment failed: ${result.response.status} ${JSON.stringify(result.body)}`);
            }
            return result.body.payment;
          }

          const payment = await createPayment(500, 'paid');
          const walletBeforeWebhook = await call('/api/v1/wallet', { headers: authHeaders });
          if (walletBeforeWebhook.body?.balanceAfn !== '0') {
            throw new Error('Creating a checkout session changed wallet balance');
          }

          const baseWebhook = {
            status_code: 10,
            success: true,
            message: 'Operation successful',
            transaction_id: `trx-${Date.now()}`,
            amount: 500,
            timestamp: '1707719607',
            user_id: payment.id,
            items: [{ id: payment.id, name: 'VELIXEO Wallet Top-up', price: 500 }],
            email,
          };

          const invalidSignature = await call('/api/v1/payments/hesabpay/webhook', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ ...baseWebhook, signature: 'invalid-signature' }),
          });
          if (invalidSignature.response.status !== 401) {
            throw new Error(`Invalid signature accepted: ${invalidSignature.response.status}`);
          }

          const mismatch = await call('/api/v1/payments/hesabpay/webhook', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ ...baseWebhook, amount: 499, signature: 'ci-valid-signature' }),
          });
          if (mismatch.response.status !== 409 || mismatch.body?.error !== 'payment_amount_mismatch') {
            throw new Error(`Amount mismatch accepted: ${mismatch.response.status} ${JSON.stringify(mismatch.body)}`);
          }

          const walletAfterRejectedWebhooks = await call('/api/v1/wallet', { headers: authHeaders });
          if (walletAfterRejectedWebhooks.body?.balanceAfn !== '0') {
            throw new Error('Rejected webhooks changed wallet balance');
          }

          const validBody = { ...baseWebhook, signature: 'ci-valid-signature' };
          const valid = await call('/api/v1/payments/hesabpay/webhook', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(validBody),
          });
          if (valid.response.status !== 200 || valid.body?.status !== 'PAID' || valid.body?.idempotent !== false) {
            throw new Error(`Valid webhook failed: ${valid.response.status} ${JSON.stringify(valid.body)}`);
          }

          const walletAfterValid = await call('/api/v1/wallet', { headers: authHeaders });
          if (walletAfterValid.body?.balanceAfn !== '500') {
            throw new Error(`Wallet was not credited exactly 500 AFN: ${JSON.stringify(walletAfterValid.body)}`);
          }

          const duplicate = await call('/api/v1/payments/hesabpay/webhook', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(validBody),
          });
          if (duplicate.response.status !== 200 || duplicate.body?.idempotent !== true) {
            throw new Error(`Duplicate webhook was not idempotent: ${duplicate.response.status}`);
          }

          const walletAfterDuplicate = await call('/api/v1/wallet', { headers: authHeaders });
          if (walletAfterDuplicate.body?.balanceAfn !== '500') {
            throw new Error('Duplicate webhook credited the wallet twice');
          }

          const paidStatus = await call(`/api/v1/payments/${payment.id}`, { headers: authHeaders });
          if (
            paidStatus.response.status !== 200 ||
            paidStatus.body?.payment?.status !== 'PAID' ||
            paidStatus.body?.payment?.externalId !== baseWebhook.transaction_id ||
            !paidStatus.body?.payment?.verifiedAt
          ) {
            throw new Error(`Paid status incomplete: ${JSON.stringify(paidStatus.body)}`);
          }

          const failedPayment = await createPayment(300, 'failed');
          const failedWebhook = await call('/api/v1/payments/hesabpay/webhook', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              success: false,
              message: 'Payment declined',
              signature: 'ci-valid-signature',
              timestamp: '1707719607',
              user_id: failedPayment.id,
              items: [{ id: failedPayment.id, name: 'VELIXEO Wallet Top-up', price: 300 }],
            }),
          });
          if (failedWebhook.response.status !== 200 || failedWebhook.body?.status !== 'FAILED') {
            throw new Error(`Verified failure webhook not recorded: ${failedWebhook.response.status} ${JSON.stringify(failedWebhook.body)}`);
          }

          const walletAfterFailure = await call('/api/v1/wallet', { headers: authHeaders });
          if (walletAfterFailure.body?.balanceAfn !== '500') {
            throw new Error('Failure webhook changed wallet balance');
          }

          const reusedTransactionPayment = await createPayment(100, 'reused-transaction');
          const reusedTransaction = await call('/api/v1/payments/hesabpay/webhook', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              ...baseWebhook,
              user_id: reusedTransactionPayment.id,
              items: [{ id: reusedTransactionPayment.id, name: 'VELIXEO Wallet Top-up', price: 100 }],
              amount: 100,
              signature: 'ci-valid-signature',
            }),
          });
          if (reusedTransaction.response.status !== 409 || reusedTransaction.body?.error !== 'payment_transaction_conflict') {
            throw new Error(`Reused gateway transaction was accepted: ${reusedTransaction.response.status} ${JSON.stringify(reusedTransaction.body)}`);
          }

          const finalWallet = await call('/api/v1/wallet', { headers: authHeaders });
          if (finalWallet.body?.balanceAfn !== '500') {
            throw new Error('Transaction conflict changed wallet balance');
          }

          console.log('Verified HesabPay webhook safety tests passed.');
          NODE

      - name: Show logs on failure
        if: failure()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/velixeo-backend.log" || true
          cat "$RUNNER_TEMP/hesabpay-mock.log" || true

      - name: Stop test services
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/velixeo-backend.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/velixeo-backend.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/hesabpay-mock.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/hesabpay-mock.pid")" 2>/dev/null || true
          fi
