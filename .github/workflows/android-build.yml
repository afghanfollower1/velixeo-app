name: Build VELIXEO Android APK

on:
  workflow_dispatch:

concurrency:
  group: velixeo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify stable Android project
        run: |
          test -f android/app/build.gradle.kts || test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          grep -R "com.velixeo.velixeo" android/app >/dev/null

      - name: Configure production signing when available
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            test -n "${ANDROID_KEYSTORE_PASSWORD:-}"
            test -n "${ANDROID_KEY_ALIAS:-}"
            test -n "${ANDROID_KEY_PASSWORD:-}"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/velixeo-release.jks
            cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=velixeo-release.jks
          EOF
            echo "VELIXEO production signing configured."
          else
            echo "Production signing secrets are not configured; this build will use development signing."
          fi

      - name: Print signing SHA-1 when production key exists
        run: |
          if [ -f android/app/velixeo-release.jks ]; then
            keytool -list -v \
              -keystore android/app/velixeo-release.jks \
              -alias "$ANDROID_KEY_ALIAS" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              | grep -E 'SHA1:|SHA-1:' || true
          fi

      - name: Generate VELIXEO launcher icon
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, size in sizes.items():
              img = Image.new('RGB', (size, size), '#0D78C8')
              px = img.load()
              top = (77, 184, 255)
              bottom = (13, 120, 200)
              for y in range(size):
                  t = y / max(1, size - 1)
                  c = tuple(int(top[i]*(1-t)+bottom[i]*t) for i in range(3))
                  for x in range(size):
                      px[x, y] = c
              d = ImageDraw.Draw(img)
              w = max(5, int(size*.13))
              pts = [(int(size*.25), int(size*.29)), (int(size*.49), int(size*.72)), (int(size*.72), int(size*.31))]
              d.line(pts, fill='white', width=w, joint='curve')
              r = int(size*.07)
              cx, cy = int(size*.77), int(size*.22)
              d.ellipse((cx-r, cy-r, cx+r, cy+r), fill='white')
              out = Path('android/app/src/main/res') / folder
              out.mkdir(parents=True, exist_ok=True)
              img.save(out / 'ic_launcher.png')
              img.save(out / 'ic_launcher_round.png')
          PY

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/VELIXEO-v0.3.0-release.apk
          ls -lh dist/VELIXEO-v0.3.0-release.apk
          sha256sum dist/VELIXEO-v0.3.0-release.apk | tee dist/SHA256SUMS.txt
          if [ -f android/app/velixeo-release.jks ]; then
            keytool -list -v \
              -keystore android/app/velixeo-release.jks \
              -alias "$ANDROID_KEY_ALIAS" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              | grep -E 'SHA1:|SHA-1:' > dist/ANDROID_SIGNING_SHA1.txt || true
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELIXEO-v0.3.0-Android-APK
          path: |
            dist/VELIXEO-v0.3.0-release.apk
            dist/SHA256SUMS.txt
            dist/ANDROID_SIGNING_SHA1.txt
          if-no-files-found: warn
          retention-days: 30
