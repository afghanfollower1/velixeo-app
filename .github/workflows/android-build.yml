name: Build VELIXEO Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create Android platform scaffold
        run: |
          rm -rf /tmp/velixeo_scaffold
          flutter create --platforms=android --org com.velixeo --project-name velixeo /tmp/velixeo_scaffold
          cp -R /tmp/velixeo_scaffold/android ./android
          cp /tmp/velixeo_scaffold/.metadata ./.metadata
          sed -i 's/android:label="velixeo"/android:label="VELIXEO"/' android/app/src/main/AndroidManifest.xml

      - name: Generate VELIXEO launcher icon
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, size in sizes.items():
              img = Image.new('RGB', (size, size), '#0D6EFD')
              px = img.load()
              top = (73, 197, 255)
              bottom = (13, 110, 253)
              for y in range(size):
                  t = y / max(1, size - 1)
                  c = tuple(int(top[i]*(1-t)+bottom[i]*t) for i in range(3))
                  for x in range(size):
                      px[x, y] = c
              d = ImageDraw.Draw(img)
              w = max(5, int(size*.13))
              pts = [(int(size*.25), int(size*.29)), (int(size*.49), int(size*.72)), (int(size*.72), int(size*.31))]
              d.line(pts, fill='white', width=w, joint='curve')
              r = int(size*.07)
              cx, cy = int(size*.77), int(size*.22)
              d.ellipse((cx-r, cy-r, cx+r, cy+r), fill='white')
              out = Path('android/app/src/main/res') / folder
              out.mkdir(parents=True, exist_ok=True)
              img.save(out / 'ic_launcher.png')
              img.save(out / 'ic_launcher_round.png')
          PY

      - name: Get Flutter packages
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib/main.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/VELIXEO-v0.1.0-release.apk
          ls -lh dist/VELIXEO-v0.1.0-release.apk
          sha256sum dist/VELIXEO-v0.1.0-release.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELIXEO-Android-APK
          path: |
            dist/VELIXEO-v0.1.0-release.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
