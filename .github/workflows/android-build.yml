name: Build VELIXEO Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'BUILD_TRIGGER.txt'

concurrency:
  group: velixeo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_RELEASE_SHA1: C3:54:C7:03:DD:FC:DD:C5:83:A8:A6:4F:64:DA:4E:5E:18:43:5B:A4

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify stable Android project
        run: |
          test -f android/app/build.gradle.kts || test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          grep -R "com.velixeo.velixeo" android/app >/dev/null

      - name: Verify required production secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in GOOGLE_WEB_CLIENT_ID ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured. Production APK build is blocked."
              exit 1
            fi
          done
          if [[ "$GOOGLE_WEB_CLIENT_ID" != *.apps.googleusercontent.com ]]; then
            echo "::error::GOOGLE_WEB_CLIENT_ID does not look like a Google OAuth Web Client ID."
            exit 1
          fi
          if [ "$ANDROID_KEY_ALIAS" != "velixeo" ]; then
            echo "::error::ANDROID_KEY_ALIAS must be velixeo for the permanent VELIXEO release key."
            exit 1
          fi

      - name: Configure production signing
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/velixeo-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=velixeo-release.jks
          EOF
          keytool -list -v \
            -keystore android/app/velixeo-release.jks \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" >/tmp/velixeo-key.txt
          echo "VELIXEO production signing configured."

      - name: Verify permanent signing SHA-1
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA1=$(grep -E 'SHA1:|SHA-1:' /tmp/velixeo-key.txt | head -n1 | sed -E 's/.*SHA-?1:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | xargs)
          if [ -z "$ACTUAL_SHA1" ]; then
            echo "::error::Could not read SHA-1 from the release keystore."
            exit 1
          fi
          if [ "$ACTUAL_SHA1" != "$EXPECTED_RELEASE_SHA1" ]; then
            echo "::error::Release keystore SHA-1 does not match the permanent VELIXEO signing key."
            echo "Expected: $EXPECTED_RELEASE_SHA1"
            echo "Actual:   $ACTUAL_SHA1"
            exit 1
          fi
          printf '%s\n' "$ACTUAL_SHA1" > /tmp/ANDROID_SIGNING_SHA1.txt
          echo "Permanent VELIXEO signing key verified."

      - name: Generate VELIXEO launcher icon
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, size in sizes.items():
              img = Image.new('RGB', (size, size), '#0D78C8')
              px = img.load()
              top = (77, 184, 255)
              bottom = (13, 120, 200)
              for y in range(size):
                  t = y / max(1, size - 1)
                  c = tuple(int(top[i]*(1-t)+bottom[i]*t) for i in range(3))
                  for x in range(size):
                      px[x, y] = c
              d = ImageDraw.Draw(img)
              w = max(5, int(size*.13))
              pts = [(int(size*.25), int(size*.29)), (int(size*.49), int(size*.72)), (int(size*.72), int(size*.31))]
              d.line(pts, fill='white', width=w, joint='curve')
              r = int(size*.07)
              cx, cy = int(size*.77), int(size*.22)
              d.ellipse((cx-r, cy-r, cx+r, cy+r), fill='white')
              out = Path('android/app/src/main/res') / folder
              out.mkdir(parents=True, exist_ok=True)
              img.save(out / 'ic_launcher.png')
              img.save(out / 'ic_launcher_round.png')
          PY

      - name: Configure native Firebase push resources
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          set -euo pipefail
          PROJECT_ID="${FIREBASE_PROJECT_ID:-}"
          API_KEY="${FIREBASE_ANDROID_API_KEY:-}"
          APP_ID="${FIREBASE_ANDROID_APP_ID:-}"
          SENDER_ID="${FIREBASE_MESSAGING_SENDER_ID:-}"

          if [ -z "$PROJECT_ID" ] || [ -z "$API_KEY" ] || [ -z "$APP_ID" ] || [ -z "$SENDER_ID" ]; then
            echo "Firebase GitHub secrets are incomplete; trying production push-config."
            CONFIG=$(curl --fail --silent --show-error --max-time 15 https://velixeo-api-production.up.railway.app/api/v1/content/push-config || true)
            if [ -n "$CONFIG" ]; then
              export CONFIG
              eval "$(python3 - <<'PY'
          import json, os, shlex
          try:
              x = json.loads(os.environ.get("CONFIG", "{}"))
          except Exception:
              x = {}
          for env, key in [
              ("PROJECT_ID", "projectId"),
              ("API_KEY", "apiKey"),
              ("APP_ID", "appId"),
              ("SENDER_ID", "messagingSenderId"),
          ]:
              value = x.get(key) or ""
              print(f"{env}={shlex.quote(str(value))}")
          PY
          )"
            fi
          fi

          if [ -n "$PROJECT_ID" ] && [ -n "$API_KEY" ] && [ -n "$APP_ID" ] && [ -n "$SENDER_ID" ]; then
            mkdir -p android/app/src/main/res/values
            export PROJECT_ID API_KEY APP_ID SENDER_ID
            python3 - <<'PY'
          from pathlib import Path
          from xml.sax.saxutils import escape
          import os
          project_id = os.environ["PROJECT_ID"]
          api_key = os.environ["API_KEY"]
          app_id = os.environ["APP_ID"]
          sender_id = os.environ["SENDER_ID"]
          xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="google_app_id" translatable="false">{escape(app_id)}</string>
              <string name="gcm_defaultSenderId" translatable="false">{escape(sender_id)}</string>
              <string name="google_api_key" translatable="false">{escape(api_key)}</string>
              <string name="google_storage_bucket" translatable="false">{escape(project_id)}.appspot.com</string>
              <string name="project_id" translatable="false">{escape(project_id)}</string>
          </resources>
          """
          Path("android/app/src/main/res/values/velixeo_firebase.xml").write_text(xml, encoding="utf-8")
          PY
            echo "Native Firebase resources embedded for terminated-state push."
          else
            echo "::warning::Firebase production credentials are not configured yet. APK will build, but remote push cannot activate until Firebase is configured on the backend."
          fi

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"

      - name: Prepare artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/VELIXEO-v0.6.2-release.apk
          cp /tmp/ANDROID_SIGNING_SHA1.txt dist/ANDROID_SIGNING_SHA1.txt
          ls -lh dist/VELIXEO-v0.6.2-release.apk
          sha256sum dist/VELIXEO-v0.6.2-release.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELIXEO-v0.6.2-Android-APK
          path: |
            dist/VELIXEO-v0.6.2-release.apk
            dist/SHA256SUMS.txt
            dist/ANDROID_SIGNING_SHA1.txt
          if-no-files-found: error
          retention-days: 30
