name: Validate Current VELIXEO Backend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-current-backend.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://velixeo:velixeo@127.0.0.1:5432/velixeo?schema=public
      NODE_ENV: test
      PORT: 8080
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      CORS_ORIGINS: ''

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velixeo
          POSTGRES_PASSWORD: velixeo
          POSTGRES_DB: velixeo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U velixeo -d velixeo"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma db push
      - run: npx prisma generate
      - run: npm run build
      - name: Start and health-check current backend
        shell: bash
        run: |
          set -euo pipefail
          node dist/index.js > "$RUNNER_TEMP/velixeo.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/velixeo.log"
          exit 1
