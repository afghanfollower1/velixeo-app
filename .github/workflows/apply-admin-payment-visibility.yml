name: Apply VELIXEO Admin Payment Visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-admin-payment-visibility.yml'
      - 'tools/patch_admin_payment_visibility.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Improve payment admin visibility
        run: python3 tools/patch_admin_payment_visibility.py

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VELIXEO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/adminExtended.ts
          if git diff --cached --quiet; then
            echo "Admin payment visibility already applied."
            exit 0
          fi
          git commit -m "Show verified payment state in admin"
          git push origin HEAD:main
