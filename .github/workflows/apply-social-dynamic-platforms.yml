name: Apply VELIXEO Dynamic Social Platforms

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_social_dynamic_platforms.py'
      - '.github/workflows/apply-social-dynamic-platforms.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply dynamic platform support
        run: python3 tools/patch_social_dynamic_platforms.py
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VELIXEO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/social/social_panel.dart
          if git diff --cached --quiet; then
            echo "Dynamic platform support already applied."
            exit 0
          fi
          git commit -m "Support dynamic social platforms without APK changes"
          git push origin HEAD:main
