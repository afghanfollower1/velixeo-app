name: Validate VELIXEO Flutter

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'chatgpt/**']
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: velixeo-flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Format source
        run: dart format lib

      - name: Analyze source
        run: flutter analyze --no-fatal-infos


  dispatch-v0142-release:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'release/dispatch-v0142-final'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch signed VELIXEO 0.14.2 Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-build.yml --repo "${{ github.repository }}" --ref main
