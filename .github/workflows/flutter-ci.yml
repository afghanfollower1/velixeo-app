name: VELIXEO 0.13 bootstrap

on:
  push:
    branches:
      - 'chatgpt/v013-orders-admin-design-20260924'
    paths:
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: write

concurrency:
  group: v013-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and apply corrections
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/v013_*.b64 | tr -d '\n' | base64 -d > /tmp/v013_patch.py
          python3 /tmp/v013_patch.py

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format and analyze Flutter
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/app.dart lib/social/social_panel.dart
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Restore CI and commit validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/patches
          git checkout origin/main -- .github/workflows/flutter-ci.yml
          git config user.name "VELIXEO Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix Social banners, order filters and bilingual Admin design"
          git push origin HEAD:chatgpt/v013-orders-admin-design-20260924
