name: Apply VELIXEO Flutter Payments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-flutter-payments.yml'
      - 'tools/patch_flutter_payments.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply Flutter payment foundation
        run: python3 tools/patch_flutter_payments.py

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VELIXEO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pubspec.yaml lib/core/models.dart lib/core/api_service.dart lib/app.dart
          if git diff --cached --quiet; then
            echo "Flutter payment foundation already applied."
            exit 0
          fi
          git commit -m "Connect Flutter wallet top-ups to verified payments"
          git push origin HEAD:main
