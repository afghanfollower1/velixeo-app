name: Test VELIXEO Backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'chatgpt/**']
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: velixeo-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://velixeo:velixeo@127.0.0.1:5432/velixeo?schema=public
      NODE_ENV: test
      PORT: 8080
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      CORS_ORIGINS: ''
      HESABPAY_ENVIRONMENT: sandbox
      HESABPAY_API_KEY: ci-hesabpay-api-key
      HESABPAY_API_BASE_URL: http://127.0.0.1:9081
      PUBLIC_BASE_URL: http://127.0.0.1:8080

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velixeo
          POSTGRES_PASSWORD: velixeo
          POSTGRES_DB: velixeo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U velixeo -d velixeo"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Create ephemeral CI database schema
        run: npx prisma db push

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript build
        run: npm run build

      - name: Start HesabPay mock gateway
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/hesabpay-mock.mjs" <<'NODE'
          import http from 'node:http';

          const server = http.createServer(async (req, res) => {
            if (req.method !== 'POST' || req.url !== '/api/v1/payment/create-session') {
              res.writeHead(404, { 'content-type': 'application/json' });
              res.end(JSON.stringify({ success: false, message: 'not found' }));
              return;
            }
            if (req.headers.authorization !== 'API-KEY ci-hesabpay-api-key') {
              res.writeHead(401, { 'content-type': 'application/json' });
              res.end(JSON.stringify({ success: false, message: 'bad api key' }));
              return;
            }

            let raw = '';
            for await (const chunk of req) raw += chunk;
            let body;
            try { body = JSON.parse(raw); } catch { body = null; }

            const valid =
              body &&
              typeof body.user_id === 'string' &&
              Array.isArray(body.items) &&
              body.items.length === 1 &&
              body.items[0]?.id === body.user_id &&
              body.items[0]?.name === 'VELIXEO Wallet Top-up' &&
              body.items[0]?.price === 500 &&
              typeof body.redirect_success_url === 'string' &&
              typeof body.redirect_failure_url === 'string';

            if (!valid) {
              res.writeHead(400, { 'content-type': 'application/json' });
              res.end(JSON.stringify({ success: false, message: 'invalid payload' }));
              return;
            }

            res.writeHead(200, { 'content-type': 'application/json' });
            res.end(JSON.stringify({
              status_code: 10,
              success: true,
              message: 'Payment session created successfully',
              url: `https://checkout.example/${body.user_id}`,
            }));
          });

          server.listen(9081, '127.0.0.1');
          NODE
          node "$RUNNER_TEMP/hesabpay-mock.mjs" > "$RUNNER_TEMP/hesabpay-mock.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/hesabpay-mock.pid"
          for attempt in {1..20}; do
            if curl --silent http://127.0.0.1:9081/ >/dev/null; then
              echo "HesabPay mock gateway is ready."
              exit 0
            fi
            sleep 0.25
          done
          cat "$RUNNER_TEMP/hesabpay-mock.log"
          echo "HesabPay mock gateway did not start."
          exit 1

      - name: Start backend for smoke tests
        shell: bash
        run: |
          set -euo pipefail
          node dist/index.js > "$RUNNER_TEMP/velixeo-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/velixeo-backend.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              echo "VELIXEO backend is ready."
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/velixeo-backend.log"
          echo "Backend did not become healthy in time."
          exit 1

      - name: Run auth wallet payment client API and admin security smoke tests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = 'http://127.0.0.1:8080';
          const email = `ci-${Date.now()}@example.invalid`;
          const password = 'VELIXEO-CI-Password-123!';

          async function jsonRequest(path, options = {}) {
            const response = await fetch(`${base}${path}`, options);
            const text = await response.text();
            let body = null;
            if (text) {
              try { body = JSON.parse(text); } catch { body = text; }
            }
            return { response, body };
          }

          const health = await jsonRequest('/health');
          if (health.response.status !== 200 || health.body?.status !== 'ok') {
            throw new Error(`Health check failed: ${health.response.status}`);
          }

          const crossSiteAdmin = await jsonRequest('/admin/login', {
            method: 'POST',
            headers: {
              'content-type': 'application/x-www-form-urlencoded',
              origin: 'https://attacker.example',
              'sec-fetch-site': 'cross-site',
            },
            body: 'identifier=admin%40example.invalid&password=wrong-password',
          });
          if (crossSiteAdmin.response.status !== 403 || crossSiteAdmin.body !== 'admin_request_origin_rejected') {
            throw new Error(`Cross-site admin form request was not rejected: ${crossSiteAdmin.response.status}`);
          }

          const sameOriginAdmin = await jsonRequest('/admin/login', {
            method: 'POST',
            headers: {
              'content-type': 'application/x-www-form-urlencoded',
              origin: base,
              'sec-fetch-site': 'same-origin',
            },
            body: 'identifier=admin%40example.invalid&password=wrong-password',
          });
          if (sameOriginAdmin.response.status !== 401) {
            throw new Error(`Same-origin admin form request was blocked unexpectedly: ${sameOriginAdmin.response.status}`);
          }

          const registration = await jsonRequest('/api/v1/auth/register', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              fullName: 'VELIXEO CI User',
              email,
              password,
              locale: 'FA',
            }),
          });
          if (registration.response.status !== 201 || !registration.body?.accessToken) {
            throw new Error(`Registration failed: ${registration.response.status} ${JSON.stringify(registration.body)}`);
          }
          const token = registration.body.accessToken;
          const authHeaders = { authorization: `Bearer ${token}` };

          const me = await jsonRequest('/api/v1/me', { headers: authHeaders });
          if (me.response.status !== 200 || me.body?.user?.email !== email) {
            throw new Error(`Authenticated profile failed: ${me.response.status}`);
          }
          if (me.body?.user?.status !== 'ACTIVE') {
            throw new Error(`New user status is not ACTIVE: ${me.body?.user?.status}`);
          }

          const wallet = await jsonRequest('/api/v1/wallet', { headers: authHeaders });
          if (wallet.response.status !== 200 || wallet.body?.balanceAfn !== '0') {
            throw new Error(`Wallet smoke test failed: ${wallet.response.status} ${JSON.stringify(wallet.body)}`);
          }

          const login = await jsonRequest('/api/v1/auth/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ identifier: email, password }),
          });
          if (login.response.status !== 200 || !login.body?.refreshToken) {
            throw new Error(`Login smoke test failed: ${login.response.status}`);
          }

          const idempotencyKey = `ci-wallet-topup-${Date.now()}`;
          const paymentSession = await jsonRequest('/api/v1/payments/hesabpay/session', {
            method: 'POST',
            headers: {
              ...authHeaders,
              'content-type': 'application/json',
            },
            body: JSON.stringify({ amountAfn: 500, idempotencyKey }),
          });
          if (
            paymentSession.response.status !== 201 ||
            paymentSession.body?.payment?.status !== 'PENDING' ||
            paymentSession.body?.payment?.amountAfn !== '500' ||
            typeof paymentSession.body?.checkoutUrl !== 'string' ||
            paymentSession.body?.idempotent !== false
          ) {
            throw new Error(`Payment session failed: ${paymentSession.response.status} ${JSON.stringify(paymentSession.body)}`);
          }
          const paymentId = paymentSession.body.payment.id;

          const paymentStatus = await jsonRequest(`/api/v1/payments/${paymentId}`, { headers: authHeaders });
          if (paymentStatus.response.status !== 200 || paymentStatus.body?.payment?.status !== 'PENDING') {
            throw new Error(`Payment status endpoint failed: ${paymentStatus.response.status}`);
          }

          const repeatedSession = await jsonRequest('/api/v1/payments/hesabpay/session', {
            method: 'POST',
            headers: {
              ...authHeaders,
              'content-type': 'application/json',
            },
            body: JSON.stringify({ amountAfn: 500, idempotencyKey }),
          });
          if (
            repeatedSession.response.status !== 200 ||
            repeatedSession.body?.payment?.id !== paymentId ||
            repeatedSession.body?.idempotent !== true
          ) {
            throw new Error(`Payment idempotency failed: ${repeatedSession.response.status} ${JSON.stringify(repeatedSession.body)}`);
          }

          const walletAfterSession = await jsonRequest('/api/v1/wallet', { headers: authHeaders });
          if (walletAfterSession.response.status !== 200 || walletAfterSession.body?.balanceAfn !== '0') {
            throw new Error(`Payment redirect/session incorrectly changed wallet balance: ${JSON.stringify(walletAfterSession.body)}`);
          }

          const paymentList = await jsonRequest('/api/v1/payments', { headers: authHeaders });
          if (
            paymentList.response.status !== 200 ||
            !Array.isArray(paymentList.body?.payments) ||
            !paymentList.body.payments.some((item) => item.id === paymentId)
          ) {
            throw new Error(`Payment list endpoint failed: ${paymentList.response.status}`);
          }

          const successReturn = await jsonRequest(`/payments/hesabpay/return/success?payment=${paymentId}`);
          if (successReturn.response.status !== 200 || typeof successReturn.body !== 'string') {
            throw new Error(`Payment success return page failed: ${successReturn.response.status}`);
          }

          const catalog = await jsonRequest('/api/v1/catalog/services');
          if (catalog.response.status !== 200 || catalog.body?.baseCurrency !== 'AFN' || !Array.isArray(catalog.body?.services)) {
            throw new Error(`Catalog endpoint failed: ${catalog.response.status}`);
          }

          const banners = await jsonRequest('/api/v1/content/banners');
          if (banners.response.status !== 200 || !Array.isArray(banners.body?.banners)) {
            throw new Error(`Banners endpoint failed: ${banners.response.status}`);
          }

          const notifications = await jsonRequest('/api/v1/content/notifications', { headers: authHeaders });
          if (notifications.response.status !== 200 || !Array.isArray(notifications.body?.notifications)) {
            throw new Error(`Notifications endpoint failed: ${notifications.response.status}`);
          }

          const orders = await jsonRequest('/api/v1/orders', { headers: authHeaders });
          if (orders.response.status !== 200 || !Array.isArray(orders.body?.orders)) {
            throw new Error(`Orders endpoint failed: ${orders.response.status}`);
          }

          const publicConfig = await jsonRequest('/api/v1/system/public-config');
          if (publicConfig.response.status !== 200 || !Array.isArray(publicConfig.body?.settings)) {
            throw new Error(`Public config endpoint failed: ${publicConfig.response.status}`);
          }

          const rates = await jsonRequest('/api/v1/rates');
          if (rates.response.status !== 200 || rates.body?.baseCurrency !== 'AFN') {
            throw new Error(`Rates endpoint failed: ${rates.response.status}`);
          }

          const googleWithoutConfig = await jsonRequest('/api/v1/auth/google', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ idToken: 'not-a-real-google-id-token-value', locale: 'FA' }),
          });
          if (googleWithoutConfig.response.status !== 503 || googleWithoutConfig.body?.error !== 'google_auth_not_configured') {
            throw new Error(`Google safe-failure behavior changed: ${googleWithoutConfig.response.status} ${JSON.stringify(googleWithoutConfig.body)}`);
          }

          console.log('VELIXEO backend runtime, payment safety, and admin security smoke tests passed.');
          NODE

      - name: Show service logs on failure
        if: failure()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/velixeo-backend.log" || true
          cat "$RUNNER_TEMP/hesabpay-mock.log" || true

      - name: Stop smoke-test services
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/velixeo-backend.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/velixeo-backend.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/hesabpay-mock.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/hesabpay-mock.pid")" 2>/dev/null || true
          fi
