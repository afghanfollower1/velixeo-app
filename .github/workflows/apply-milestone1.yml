name: Apply VELIXEO Milestone 1

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_milestone1.py'
      - 'tools/milestone1.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply milestone patch
        run: python3 tools/patch_milestone1.py

      - name: Commit milestone implementation
        run: |
          git config user.name "VELIXEO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/index.ts lib/core/api_service.dart lib/app.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Implement Milestone 1 auth profile wallet foundation"
          git push
