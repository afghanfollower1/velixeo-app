name: Apply VELIXEO Admin Foundation

on:
  push:
    branches: [main]
    paths:
      - 'tools/admin-foundation.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply admin foundation integration
        run: python3 tools/apply-admin-foundation.py
      - name: Commit integration
        run: |
          git config user.name "VELIXEO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/index.ts backend/src/adminPage.ts
          if git diff --cached --quiet; then
            echo "Admin foundation already integrated"
            exit 0
          fi
          git commit -m "Integrate extended admin and client foundation routes"
          git push
