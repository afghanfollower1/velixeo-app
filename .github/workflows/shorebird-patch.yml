name: Shorebird VELIXEO Android Patch

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Target Shorebird release version (use latest for normal patches)'
        required: true
        default: 'latest'

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
  SHOREBIRD_APP_ID: ${{ vars.SHOREBIRD_APP_ID }}
  GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
  FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
  FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Shorebird configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SHOREBIRD_TOKEN:-}" || { echo "::error::Add SHOREBIRD_TOKEN in GitHub Actions secrets."; exit 1; }
          test -n "${SHOREBIRD_APP_ID:-}" || { echo "::error::Add SHOREBIRD_APP_ID in GitHub Actions variables."; exit 1; }
          printf 'app_id: %s\n' "$SHOREBIRD_APP_ID" > shorebird.yaml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Prepare deterministic Android patch build
        shell: bash
        run: bash tools/prepare_shorebird_android_ci.sh

      - name: Publish small OTA patch
        id: shorebird-patch
        uses: shorebirdtech/shorebird-patch@v1
        with:
          platform: android
          release-version: ${{ inputs.release_version }}
          args: '-- --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}'

      - name: Patch result
        shell: bash
        run: |
          echo "Published Shorebird patch #${{ steps.shorebird-patch.outputs.patch-number }}"
          echo "Dart-only changes are delivered in the background and apply on a later app launch."
