name: Verify VELIXEO Schema Upgrade Safety

on:
  push:
    branches: [main]
    paths:
      - 'backend/prisma/schema.prisma'
      - '.github/workflows/schema-upgrade-safety.yml'
  workflow_dispatch:

concurrency:
  group: velixeo-schema-upgrade-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://velixeo:velixeo@127.0.0.1:5432/velixeo_schema_safety?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velixeo
          POSTGRES_PASSWORD: velixeo
          POSTGRES_DB: velixeo_schema_safety
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U velixeo -d velixeo_schema_safety"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        run: npm install

      - name: Recreate last production-era schema
        shell: bash
        run: |
          set -euo pipefail
          git show 343cfd34f9638f278458dcde50bea8872643dbff:backend/prisma/schema.prisma > "$RUNNER_TEMP/production-era.prisma"
          npx prisma validate --schema="$RUNNER_TEMP/production-era.prisma"
          npx prisma db push --schema="$RUNNER_TEMP/production-era.prisma"

      - name: Seed representative production-era data
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/seed-production-era.sql" <<'SQL'
          INSERT INTO "User" (
            "id", "fullName", "email", "phone", "passwordHash", "googleSubject",
            "role", "locale", "displayCurrency", "createdAt", "updatedAt"
          ) VALUES (
            '11111111-1111-4111-8111-111111111111',
            'VELIXEO Migration Test',
            'migration-test@example.invalid',
            NULL,
            NULL,
            NULL,
            'ADMIN',
            'FA',
            'AFN',
            NOW(),
            NOW()
          );

          INSERT INTO "Wallet" (
            "id", "userId", "balanceAfn", "createdAt", "updatedAt"
          ) VALUES (
            '22222222-2222-4222-8222-222222222222',
            '11111111-1111-4111-8111-111111111111',
            12500,
            NOW(),
            NOW()
          );

          INSERT INTO "WalletEntry" (
            "id", "walletId", "type", "status", "amountAfn", "balanceAfterAfn",
            "referenceType", "referenceId", "description", "metadata", "idempotencyKey", "createdAt"
          ) VALUES (
            '33333333-3333-4333-8333-333333333333',
            '22222222-2222-4222-8222-222222222222',
            'MANUAL_CREDIT',
            'COMPLETED',
            12500,
            12500,
            'migration-test',
            'baseline',
            'Schema upgrade safety seed',
            NULL,
            'migration-safety-baseline',
            NOW()
          );

          INSERT INTO "ExchangeRate" (
            "id", "code", "afnPerUnit", "updatedAt", "createdAt"
          ) VALUES (
            '44444444-4444-4444-8444-444444444444',
            'USD',
            68.50000000,
            NOW(),
            NOW()
          );
          SQL
          npx prisma db execute --schema="$RUNNER_TEMP/production-era.prisma" --file="$RUNNER_TEMP/seed-production-era.sql"

      - name: Upgrade to current schema without accepting data loss
        shell: bash
        run: |
          set -euo pipefail
          npx prisma validate --schema=prisma/schema.prisma
          # Intentionally do NOT pass --accept-data-loss. If Prisma sees a destructive
          # change, this step must fail rather than silently approving it.
          npx prisma db push --schema=prisma/schema.prisma
          npx prisma generate --schema=prisma/schema.prisma

      - name: Verify old data survived and new schema works
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { PrismaClient } from '@prisma/client';

          const db = new PrismaClient();
          try {
            const user = await db.user.findUnique({
              where: { id: '11111111-1111-4111-8111-111111111111' },
              include: { wallet: { include: { entries: true } } },
            });
            if (!user) throw new Error('Seeded user was lost during schema upgrade');
            if (user.role !== 'ADMIN') throw new Error(`User role changed unexpectedly: ${user.role}`);
            if (user.status !== 'ACTIVE') throw new Error(`New status default is not ACTIVE: ${user.status}`);
            if (!user.wallet || user.wallet.balanceAfn.toString() !== '12500') {
              throw new Error('Wallet balance was not preserved');
            }
            if (user.wallet.entries.length !== 1) {
              throw new Error(`Expected one preserved wallet entry, got ${user.wallet.entries.length}`);
            }

            const rate = await db.exchangeRate.findUnique({ where: { code: 'USD' } });
            if (!rate || rate.afnPerUnit.toString() !== '68.5') {
              throw new Error('Exchange rate was not preserved');
            }

            const banner = await db.banner.create({
              data: {
                placement: 'HOME_HERO',
                imageUrl: 'https://example.invalid/schema-safety.png',
                enabled: false,
              },
            });
            await db.banner.delete({ where: { id: banner.id } });

            console.log('Schema upgrade safety verified: production-era data preserved and new tables usable.');
          } finally {
            await db.$disconnect();
          }
          NODE
