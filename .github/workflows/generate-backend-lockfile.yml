name: Generate VELIXEO Backend Lockfile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-backend-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: velixeo-backend-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate backend package-lock.json
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/package-lock.json && git ls-files --error-unmatch backend/package-lock.json >/dev/null 2>&1; then
            echo "backend/package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "Lock backend npm dependencies"
          git push origin HEAD:main
