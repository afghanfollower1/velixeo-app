name: Fix VELIXEO Social Backend Types

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-social-backend-types.yml'
      - 'tools/fix_social_backend_types.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fix_social_backend_types.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "VELIXEO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/socialRoutes.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix social backend TypeScript validation"
          git push origin HEAD:main
