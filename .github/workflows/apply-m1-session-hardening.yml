name: Apply VELIXEO M1 Session Hardening

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_m1_session_hardening.py'
      - 'tools/m1-session-hardening.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply hardening patch
        run: python3 tools/patch_m1_session_hardening.py

      - name: Commit implementation
        run: |
          git config user.name "VELIXEO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/index.ts lib/core/api_service.dart lib/app.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Harden Milestone 1 sessions and wallet UX"
          git push
