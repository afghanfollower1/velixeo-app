name: Apply VELIXEO Admin Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-admin-readiness.yml'
      - 'tools/patch_admin_readiness.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Add safe readiness dashboard
        run: python3 tools/patch_admin_readiness.py

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VELIXEO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/adminExtended.ts
          if git diff --cached --quiet; then
            echo "Admin readiness dashboard already applied."
            exit 0
          fi
          git commit -m "Add safe production readiness dashboard"
          git push origin HEAD:main
