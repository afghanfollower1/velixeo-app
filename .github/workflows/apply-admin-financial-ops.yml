name: Apply VELIXEO Admin Financial Ops

on:
  push:
    branches: [main]
    paths:
      - 'tools/admin-financial-ops.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply safe refund reporting and metadata patch
        run: python3 tools/apply-admin-financial-ops.py
      - name: Commit patch
        run: |
          git config user.name "VELIXEO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/adminExtended.ts
          if git diff --cached --quiet; then
            echo "Admin financial ops already applied"
            exit 0
          fi
          git commit -m "Add safe refunds reports and advanced service metadata"
          git push
