name: Apply VELIXEO v0.3 Auth Patch

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_v03.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patch
        run: python3 tools/patch_v03.py

      - name: Commit updated Flutter auth UI
        run: |
          git config user.name "VELIXEO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/app.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add full name registration and Google sign-in UI"
          git push
