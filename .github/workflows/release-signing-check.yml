name: Verify VELIXEO Release Signing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-signing-check.yml'
  workflow_dispatch:

jobs:
  verify-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_SHA1: C3:54:C7:03:DD:FC:DD:C5:83:A8:A6:4F:64:DA:4E:5E:18:43:5B:A4

    steps:
      - name: Validate required secrets are present
        shell: bash
        run: |
          set -euo pipefail
          for name in GOOGLE_WEB_CLIENT_ID ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Required repository secret is missing: $name"
              exit 1
            fi
          done
          if [[ "$GOOGLE_WEB_CLIENT_ID" != *.apps.googleusercontent.com ]]; then
            echo "GOOGLE_WEB_CLIENT_ID format is invalid."
            exit 1
          fi
          if [ "$ANDROID_KEY_ALIAS" != "velixeo" ]; then
            echo "ANDROID_KEY_ALIAS must be velixeo."
            exit 1
          fi
          echo "Required signing and Google OAuth settings are present."

      - name: Decode release keystore safely
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/velixeo-release.jks"; then
            echo "ANDROID_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/velixeo-release.jks" ]; then
            echo "Decoded release keystore is empty."
            exit 1
          fi
          echo "Release keystore decoded successfully."

      - name: Verify keystore password
        shell: bash
        run: |
          set -euo pipefail
          if ! keytool -list \
            -keystore "$RUNNER_TEMP/velixeo-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            > "$RUNNER_TEMP/keystore-list.txt" 2>/dev/null; then
            echo "ANDROID_KEYSTORE_PASSWORD does not unlock the uploaded keystore, or the uploaded file is not the expected keystore."
            exit 1
          fi
          echo "Keystore password is valid."

      - name: Verify alias and certificate SHA-1
        shell: bash
        run: |
          set -euo pipefail
          if ! keytool -list -v \
            -keystore "$RUNNER_TEMP/velixeo-release.jks" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            > "$RUNNER_TEMP/cert-info.txt" 2>/dev/null; then
            echo "ANDROID_KEY_ALIAS was not found in the release keystore."
            exit 1
          fi
          ACTUAL_SHA1="$(sed -nE 's/^[[:space:]]*SHA1:[[:space:]]*//p' "$RUNNER_TEMP/cert-info.txt" | head -n1)"
          if [ -z "$ACTUAL_SHA1" ]; then
            echo "Could not read SHA-1 from the release certificate."
            exit 1
          fi
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "Release signing certificate SHA-1 does not match the registered VELIXEO Android OAuth certificate."
            echo "Expected: $EXPECTED_SHA1"
            echo "Actual:   $ACTUAL_SHA1"
            exit 1
          fi
          echo "Release certificate SHA-1 matches VELIXEO OAuth configuration."

      - name: Verify private key password by signing a disposable JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing-check"
          printf 'VELIXEO signing verification\n' > "$RUNNER_TEMP/signing-check/payload.txt"
          jar cf "$RUNNER_TEMP/signing-check.jar" -C "$RUNNER_TEMP/signing-check" payload.txt
          if ! jarsigner \
            -keystore "$RUNNER_TEMP/velixeo-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            "$RUNNER_TEMP/signing-check.jar" \
            "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "ANDROID_KEY_PASSWORD is incorrect for alias velixeo."
            exit 1
          fi
          jarsigner -verify "$RUNNER_TEMP/signing-check.jar" >/dev/null
          echo "Keystore password, key password, alias, and private key are valid."

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/velixeo-release.jks" \
            "$RUNNER_TEMP/signing-check.jar" \
            "$RUNNER_TEMP/keystore-list.txt" \
            "$RUNNER_TEMP/cert-info.txt"
          rm -rf "$RUNNER_TEMP/signing-check"
