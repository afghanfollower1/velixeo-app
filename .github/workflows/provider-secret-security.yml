name: Verify Provider Secret Encryption

on:
  push:
    branches: [main]
    paths:
      - 'backend/src/providerSecrets.ts'
      - '.github/workflows/provider-secret-security.yml'
  workflow_dispatch:

jobs:
  verify-encryption:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Verify provider secret encryption round trip
        shell: bash
        run: |
          set -euo pipefail
          export ADMIN_SECRET_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          npx tsx --eval '
            import { decryptProviderSecret, encryptProviderSecret, providerSecretEncryptionConfigured } from "./src/providerSecrets.ts";
            if (!providerSecretEncryptionConfigured()) throw new Error("Encryption key was not accepted");
            const value = "provider-secret-ci-value";
            const encrypted = encryptProviderSecret(value);
            if (decryptProviderSecret(encrypted) !== value) throw new Error("Encryption round trip failed");
            if (encrypted.secretCiphertext === value) throw new Error("Secret was not encrypted");
            console.log("Provider secret encryption round trip passed.");
          '
